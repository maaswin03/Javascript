<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../global.css" />
    <title>Task 10 - E-commerce App</title>
  </head>
  <body>
    <header class="header-container">
      <div class="header-heading">
        <h2>Kartify</h2>
      </div>
      <div class="header-nav">
        <a href="./cart/">Go to Cart</a>
      </div>
    </header>
    <!--Main container -->
    <main class="main-container">
      <!-- Filter container-->
      <section class="filter-container">
        <!-- Search filter -->
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search products" />
        </div>

        <!-- Category filter-->
        <div class="filter-group" id="radio">
          <h4>Category</h4>
          <label
            ><input type="checkbox" name="cat" value="beauty" /> Beauty</label
          >
          <label
            ><input type="checkbox" name="cat" value="fragrances" />
            Fragrances</label
          >
          <label
            ><input type="checkbox" name="cat" value="furniture" />
            Furniture</label
          >
          <label
            ><input type="checkbox" name="cat" value="groceries" />
            Groceries</label
          >
          <label
            ><input type="checkbox" name="cat" value="home-decoration" /> Home
            Decoration</label
          >
          <label
            ><input type="checkbox" name="cat" value="kitchen-accessories" />
            Kitchen Accessories</label
          >
          <label
            ><input type="checkbox" name="cat" value="laptops" /> Laptops</label
          >
          <label
            ><input type="checkbox" name="cat" value="mens" /> Men
            Accessories</label
          >
        </div>

        <!-- Availability filter -->
        <div class="filter-group">
          <h4>Availability</h4>
          <label
            ><input type="radio" name="stock" value="all" checked /> All</label
          >
          <label
            ><input type="radio" name="stock" value="In Stock" /> In
            Stock</label
          >
          <label
            ><input type="radio" name="stock" value="Low Stock" /> Low
            Stock</label
          >
        </div>

        <!-- Sort filter -->
        <div class="filter-group">
          <h4>Sort By</h4>
          <select id="sortSelect">
            <option value="">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </section>

      <!-- Card container for showing products -->
      <section class="card-container">
        <!-- cards are showed here -->
      </section>

      <!-- container to show loading and errors -->
      <section class="card-container loading-content"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
