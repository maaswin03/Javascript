<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../../global.css" />
    <title>Task 10 - E-commerce App</title>
  </head>
  <body>
    <header class="header-container">
      <div class="header-heading">
        <h2>Kartify</h2>
      </div>
      <div class="header-nav">
        <a href="../index.html">Go to Home</a>
      </div>
    </header>
    <!--Main container -->
    <main class="main-container">
      <!-- Card container for showing cart products -->
      <section class="card-container"></section>

      <!-- Container for showing loading and fetch error -->
      <section class="card-container loading-content"></section>

      <!-- container to total price and order summary -->
      <section class="payment-container">
        <!-- Search filter -->
        <div>
          <h2>Order Summary</h2>
        </div>
        <div class="payment-subcontainer">
          <h3>Sub total</h3>
          <p id="sub-total">$0</p>
        </div>
        <div class="payment-subcontainer">
          <h3>Discount</h3>
          <p id="discount">- $0</p>
        </div>
        <div class="payment-subcontainer">
          <h3>Delivery free</h3>
          <p id="delivery">$0</p>
        </div>
        <div class="checkout-container">
          <div class="payment-subcontainer">
            <h3>Total</h3>
            <p id="total">$ 0</p>
          </div>
          <div class="payment-subcontainer">
            <input type="text" placeholder="Add promo code" id="promo-code" />
            <button type="button" id="apply-button">Apply</button>
          </div>
          <div>
            <button id="checkout-btn">Checkout</button>
          </div>
        </div>
      </section>

      <!-- Popup container for showing success message-->
      <section class="success-container"></section>
      <section id="add-task-success" class="popup-at-container">
        <!-- popup header content -->
        <a href="#" class="modal-overlay"></a>
        <div class="at-popup">
          <div class="at-sub-popup-header">
            <h2>Order Placed Successfully!</h2>
            <a href="#">x</a>
          </div>

          <!-- Popup body content -->
          <div class="at-sub-popup">
            <p>
              Your order has been placed successfully. We are preparing it for
              shipment.
            </p>

            <div class="at-popup-buttons">
              <a href="#" class="task-delete-button">Close</a>
              <a href="#" class="task-complete-button">Done</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
