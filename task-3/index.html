<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../global.css" />
    <title>Task 3 - Tour Planner</title>
  </head>
  <body>
    <!-- Main section container heading , cards and popup -->
    <main class="main-container">
      <!-- hero section consist of heading and subheading -->
      <section class="hero-main-container">
        <div class="hero-sub-section">
          <h1 class="hero-header">Places You'll Brag About Forever</h1>
          <p class="hero-description">
            From jaw-dropping landmarks to hidden gems, these are the kind of
            spots that turn into stories, selfies, and serious travel envy.
          </p>
        </div>
      </section>

      <!-- card section to load each place details -->
      <section class="card-section"></section>

      <!-- Popup container -->
      <section id="popup-container" class="popup-container">
        <a href="#" class="modal-overlay"></a>
        <div class="popup" id="popup">
          <!-- popup header content -->
          <div class="sub-popup-header"></div>
          <!-- popup Body content -->
          <div class="popup-body" id="popup-body"></div>
          <!-- popup Footer content -->
          <div class="popup-footer">
            <a href="#" class="popup-footer-close">Close</a>
            <a href="#" class="popup-footer-confirm">Confirm</a>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
