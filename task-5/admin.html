<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
    <link rel="stylesheet" href="../global.css" />
    <title>Task 5 - Quiz App (Admin)</title>
  </head>
  <body>
    <main class="main-container">
      <section class="card-main-container">
        <div class="card-main-header">
          <h2>Quiz Overview</h2>
        </div>
        <!-- cards will be added here dynamically -->
        <div class="card-container">
          <!-- card for total tasks -->
          <div class="card">
            <div class="card-header">
              <p>Total Participants</p>
            </div>
            <div class="card-body">
              <h2 id="card-total-task-value">0</h2>
            </div>
            <div class="card-description">
              <p>Number of users</p>
            </div>
          </div>

          <!-- card for completed tasks -->
          <div class="card">
            <div class="card-header">
              <p>Average Score</p>
            </div>
            <div class="card-body">
              <h2 id="card-completed-value">0</h2>
            </div>
            <div class="card-description">
              <p>Overall performance</p>
            </div>
          </div>

          <!-- card for pending tasks -->
          <div class="card">
            <div class="card-header">
              <p>Highest Score</p>
            </div>
            <div class="card-body">
              <h2 id="card-pending-value">0</h2>
            </div>
            <div class="card-description">
              <p>Highest performance</p>
            </div>
          </div>

          <!-- card for progress -->
          <div class="card">
            <div class="card-header">
              <p>Lowest Score</p>
            </div>
            <div class="card-body">
              <h2 id="card-progress-value">0%</h2>
            </div>
            <div class="card-description">
              <p>Lowest performance</p>
            </div>
          </div>
        </div>
      </section>

      <section class="card-main-container">
        <div class="card-main-header">
          <h2>Detailed View</h2>
        </div>
        <!-- cards will be added here dynamically -->
        <div class="card-container">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Correct</th>
                <th>Wrong</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
