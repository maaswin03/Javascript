<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../global.css" />
    <title>Task 2 - Calculator</title>
  </head>
  <body>
    <!-- Main container for the calculator -->
    <main class="main-container">
      <div class="sub-container">
        <!-- Container to show three dots -->
        <div class="dot">
          <div class="dot-container">
            <div id="red-dot"></div>
            <div id="yellow-dot"></div>
            <div id="green-dot"></div>
          </div>
          <div class="dot-container-1">
            <p>Calculator</p>
          </div>
        </div>

        <!-- Container to show typed values and answer -->
        <div class="display">
          <div class="input-display" id="inputfield">0
          </div>
          <div class="output-display"></div>
        </div>

        <!-- Container to show the buttons for entering values-->
        <div class="button-container">
          <div class="buttons">
            <button class="btn top-btn" data-value="DEL">D</button>
            <button class="btn top-btn" data-value="AC">AC</button>
            <button class="btn top-btn" data-value="%">%</button>
            <button class="btn operator" data-value="÷">÷</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="×">×</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">-</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn" data-value="N">±</button>
            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn equals" data-value="=">=</button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
